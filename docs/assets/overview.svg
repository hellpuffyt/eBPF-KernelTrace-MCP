<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">kerneltrace-mcp data flow</title>
<desc id="d">In live mode, sched_process_exec, sched_process_exit and raw sys_enter (openat) tracepoints run the kt_exec, kt_exit and kt_open probes, which submit 312-byte RawEvent records to a BPF ring buffer. A seeded SyntheticSource emits the same bytes on any OS. A reader thread decodes, gates by kind, samples and redacts, pushes into a bounded drop-counting queue, a store thread applies count and age retention, and an MCP stdio server exposes four read-only tools.</desc>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A3AAA6"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FBF8A"/></marker></defs>
<rect width="1200" height="480" fill="#0C0D0D"/>
<text x="30" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#EEEAE2" text-anchor="start" font-weight="600">kerneltrace-mcp</text>
<text x="182" y="38" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#A3AAA6" text-anchor="start" font-weight="400">bounded, read-only kernel telemetry served over MCP stdio</text>
<rect x="30" y="82" width="520" height="170" rx="12" fill="none" stroke="#2A2E2D" stroke-width="1" stroke-dasharray="4 4"/>
<text x="42" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6" text-anchor="start" font-weight="400">Linux kernel · live mode (kernel ≥ 5.8, CAP_BPF + CAP_PERFMON or root)</text>
<rect x="46" y="98" width="230" height="140" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="60" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600">tracepoints</text>
<text x="60" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">sched:sched_process_exec</text>
<text x="60" y="161" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">sched:sched_process_exit</text>
<text x="60" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">raw sys_enter (openat only)</text>
<rect x="306" y="98" width="228" height="140" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="320" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600">kerneltrace-ebpf</text>
<text x="320" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">Aya probes kt_exec · kt_exit · kt_open</text>
<text x="320" y="161" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">reserve / submit 312-byte RawEvent</text>
<text x="320" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">BPF ring buffer, 256 KiB default</text>
<text x="320" y="195" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">(live.ring_buffer_bytes)</text>
<path d="M276 168 L304 168" fill="none" stroke="#A3AAA6" stroke-width="1.4" marker-end="url(#h)"/>
<rect x="30" y="300" width="520" height="72" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="44" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600">SyntheticSource  (default · any OS · no privileges)</text>
<text x="44" y="346" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">seeded, deterministic, byte-identical RawEvent records; optional malformed injection</text>
<rect x="600" y="98" width="260" height="274" rx="8" fill="#17191A" stroke="#3FBF8A" stroke-width="1.5"/>
<text x="614" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#3FBF8A" text-anchor="start" font-weight="600">reader thread</text>
<text x="614" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">decode: field-by-field, exact length,</text>
<text x="614" y="161" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">  kind + path_len checks, control-</text>
<text x="614" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">  character neutralisation</text>
<text x="614" y="195" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">kind gate (sources.exec/exit/open)</text>
<text x="614" y="212" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">sampler: 1 in N (sample_every)</text>
<text x="614" y="229" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">redactor: paths off by default;</text>
<text x="614" y="246" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">  prefix + substring rules</text>
<text x="614" y="263" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">every discard is counted</text>
<path d="M534 168 L598 168" fill="none" stroke="#A3AAA6" stroke-width="1.4" marker-end="url(#h)"/>
<text x="566" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#A3AAA6" text-anchor="middle" font-weight="400">mmap slot</text>
<path d="M550 336 L598 336" fill="none" stroke="#A3AAA6" stroke-width="1.4" marker-end="url(#h)"/>
<text x="574" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#A3AAA6" text-anchor="middle" font-weight="400">same bytes</text>
<rect x="910" y="98" width="260" height="100" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="924" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600">BoundedQueue</text>
<text x="924" y="144" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">push never blocks the reader</text>
<text x="924" y="161" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">drop_oldest or drop_newest</text>
<text x="924" y="178" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#A3AAA6" text-anchor="start" font-weight="400">queue_capacity, drops counted</text>
