<rect x="910" y="228" width="260" height="62" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="924" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600">store thread · EventStore</text>
<text x="924" y="274" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#A3AAA6" text-anchor="start" font-weight="400">retention by max_events + max_age_secs</text>
