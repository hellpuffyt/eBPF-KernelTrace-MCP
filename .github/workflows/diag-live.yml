name: Diag live intermittent

on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: live shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BPF_LINKER_VERSION: v0.12.0
      BPF_LINKER_SHA256: 6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679
      ITER: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-09-17
          components: rust-src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install bpf-linker
        run: |
          url="https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL "$url" -o bpf-linker.tar.zst
          echo "${BPF_LINKER_SHA256}  bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Environment
        run: |
          uname -a
          echo "KVER=$(uname -r)"
          nproc
          sudo cat /sys/kernel/tracing/events/syscalls/sys_enter_openat/format || true
          sudo cat /sys/kernel/tracing/events/syscalls/sys_enter_openat/enable || true
          grep -E 'TRACE_SYSCALL_BUF|CONFIG_PREEMPT' /boot/config-$(uname -r) || true
      - name: Build probe
        working-directory: crates/kerneltrace-ebpf
        run: cargo build --release
      - name: Build test
        run: |
          cargo build --release --features live --locked -p kerneltrace-mcp
          bin=$(cargo test --features live --locked -p kerneltrace-mcp --test live_kernel --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "live_kernel" and .profile.test) | .executable')
          echo "LIVE_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Loop main live test
        run: |
          export KERNELTRACE_EBPF_OBJECT="${GITHUB_WORKSPACE}/crates/kerneltrace-ebpf/target/bpfel-unknown-none/release/kerneltrace-ebpf"
          pass=0; fail=0
          for i in $(seq 1 $ITER); do
            if sudo -E "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1 --exact live_probe_reports_known_activity > out-$i.txt 2>&1; then
              pass=$((pass+1)); echo "ITER $i PASS"
            else
              fail=$((fail+1)); echo "ITER $i FAIL"; grep -A3 "panicked" out-$i.txt | head -4
              grep -E "^stats:|kernel never ran|stayed below" out-$i.txt | cut -c1-1500
            fi
          done
          echo "LOOP_RESULT kernel=$(uname -r) pass=$pass fail=$fail"
          sudo dmesg | grep -iE "too many tries|trace|bpf" | tail -20 || true
      - name: Diag open delivery (ftrace off, then on)
        run: |
          export KERNELTRACE_EBPF_OBJECT="${GITHUB_WORKSPACE}/crates/kerneltrace-ebpf/target/bpfel-unknown-none/release/kerneltrace-ebpf"
          for i in 1 2 3; do
            sudo -E "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1 --exact diag_open_delivery 2>&1 | grep -E "^DIAG|panicked" | cut -c1-4000
          done
          sudo mkdir -p /sys/kernel/tracing/instances/ktdiag
          echo 1 | sudo tee /sys/kernel/tracing/instances/ktdiag/events/syscalls/sys_enter_openat/enable
          for i in 1 2 3; do
            sudo -E DIAG_FTRACE=1 "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1 --exact diag_open_delivery 2>&1 | grep -E "^DIAG|panicked" | cut -c1-4000
          done
          echo 0 | sudo tee /sys/kernel/tracing/instances/ktdiag/events/syscalls/sys_enter_openat/enable
          sudo dmesg | grep -iE "too many tries|WARN" | tail -10 || true

  vm:
    strategy:
      fail-fast: false
      matrix:
        kernel: ["v7.0", "azure-7.0.0-1017", "azure-7.0.0-1017-b"]
    name: vm ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BPF_LINKER_VERSION: v0.12.0
      BPF_LINKER_SHA256: 6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679
      ITER: "25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-09-17
          components: rust-src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install bpf-linker
        run: |
          url="https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL "$url" -o bpf-linker.tar.zst
          echo "${BPF_LINKER_SHA256}  bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install qemu, virtme-ng and mainline kernel
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q qemu-system-x86 virtme-ng busybox-static >/dev/null 2>&1 || sudo apt-get install -y -q qemu-system-x86 busybox-static
          command -v vng || { pipx install virtme-ng && echo "$HOME/.local/bin" >> "$GITHUB_PATH"; }
          sudo chmod 666 /dev/kvm; ls -l /dev/kvm
          case "${{ matrix.kernel }}" in
          azure-*)
            base="http://archive.ubuntu.com/ubuntu/pool/main/l/linux-azure-7.0/"
            for p in linux-image-unsigned linux-modules; do
              curl -fsSL "${base}${p}-7.0.0-1017-azure_7.0.0-1017.17~24.04.1_amd64.deb" -o "$p.deb"
            done
            kv=7.0.0-1017-azure ;;
          *)
            base="https://kernel.ubuntu.com/mainline/${{ matrix.kernel }}/amd64/"
            for p in linux-image-unsigned linux-modules; do
              f=$(curl -fsSL "$base" | grep -oE "href=\"${p}-[^\"]*generic[^\"]*amd64\.deb\"" | head -1 | cut -d'"' -f2)
              curl -fsSL "$base$f" -o "$p.deb"
            done
            kv="" ;;
          esac
          sudo dpkg -i --force-depends linux-modules.deb linux-image-unsigned.deb >/dev/null 2>&1 || true
          ls /boot/vmlinuz-*
          [ -n "$kv" ] || kv=$(ls /boot | grep -oE "vmlinuz-[0-9.]+-0[0-9]+-generic" | head -1 | sed 's/vmlinuz-//')
          grep -E "CONFIG_VIRTIO_PCI=|CONFIG_NET_9P_VIRTIO=|CONFIG_9P_FS=|CONFIG_VIRTIO_FS=|CONFIG_DEBUG_INFO_BTF=" /boot/config-$kv || true
          echo "GUEST_KVER=$kv" >> "$GITHUB_ENV"
          sudo chmod 644 /boot/vmlinuz-$kv
      - name: Build probe
        working-directory: crates/kerneltrace-ebpf
        run: cargo build --release
      - name: Build test
        run: |
          cargo build --release --features live --locked -p kerneltrace-mcp
          bin=$(cargo test --features live --locked -p kerneltrace-mcp --test live_kernel --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "live_kernel" and .profile.test) | .executable')
          echo "LIVE_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Loop inside VM
        run: |
          cat > guest.sh <<EOS
          #!/bin/sh
          mountpoint -q /sys/kernel/tracing || mount -t tracefs nodev /sys/kernel/tracing
          echo "GUEST uname: \$(uname -r) nproc=\$(nproc)"
          ls -l /sys/kernel/btf/vmlinux
          cat /sys/kernel/tracing/events/syscalls/sys_enter_openat/format
          export KERNELTRACE_EBPF_OBJECT="${GITHUB_WORKSPACE}/crates/kerneltrace-ebpf/target/bpfel-unknown-none/release/kerneltrace-ebpf"
          pass=0; fail=0
          for i in \$(seq 1 $ITER); do
            if "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1 --exact live_probe_reports_known_activity > /tmp/out-\$i.txt 2>&1; then
              pass=\$((pass+1)); echo "ITER \$i PASS"
            else
              fail=\$((fail+1)); echo "ITER \$i FAIL"; grep -A2 "panicked" /tmp/out-\$i.txt | head -3 | cut -c1-600
              grep -E "^stats:" /tmp/out-\$i.txt | cut -c1-1500
            fi
          done
          echo "LOOP_RESULT kernel=\$(uname -r) pass=\$pass fail=\$fail"
          for i in 1 2 3; do "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1 --exact diag_open_delivery 2>&1 | grep -E "^DIAG|panicked" | cut -c1-5000; done
          dmesg | grep -iE "too many tries|WARN|bpf" | tail -10
          EOS
          chmod +x guest.sh
          sudo vng -r /boot/vmlinuz-$GUEST_KVER --cpus 4 --memory 4G --user root --rwdir /tmp --exec "$PWD/guest.sh" 2>&1 | tail -n 400
