name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # On Linux --all-features also compiles the `live` (aya) source.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-features --locked

  ebpf:
    name: eBPF probe (build + object check)
    runs-on: ubuntu-latest
    env:
      BPF_LINKER_VERSION: v0.12.0
      BPF_LINKER_SHA256: 6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-09-17
          components: rust-src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install bpf-linker (prebuilt, checksum-verified)
        run: |
          url="https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL "$url" -o bpf-linker.tar.zst
          echo "${BPF_LINKER_SHA256}  bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bpf-linker --version
      - name: Build probe
        working-directory: crates/kerneltrace-ebpf
        run: cargo build --release
      - name: Check object against loader expectations
        run: cargo test -p kerneltrace-core --test probe_object --locked -- --ignored --nocapture
        env:
          KERNELTRACE_EBPF_OBJECT: ${{ github.workspace }}/crates/kerneltrace-ebpf/target/bpfel-unknown-none/release/kerneltrace-ebpf
      - name: Build live binary
        run: cargo build --release --features live --locked

  live-kernel:
    # Privileged, hardware-dependent job: kept separate from the portable jobs.
    # Loads the real probe into the runner VM's kernel under sudo.
    name: Live kernel (load probe, trace known activity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BPF_LINKER_VERSION: v0.12.0
      BPF_LINKER_SHA256: 6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-09-17
          components: rust-src
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install bpf-linker (prebuilt, checksum-verified)
        run: |
          url="https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -fsSL "$url" -o bpf-linker.tar.zst
          echo "${BPF_LINKER_SHA256}  bpf-linker.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf bpf-linker.tar.zst -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install bpftool (matching the running kernel)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q linux-tools-common linux-tools-azure
          # Flavoured kernels (e.g. -azure) install bpftool under /usr/lib/linux-<flavour>-tools-*/,
          # not /usr/lib/linux-tools*; /usr/sbin/bpftool is the linux-tools-common wrapper.
          # Take the first candidate that actually runs.
          tool=""
          for c in $(find /usr/lib -path '*tools*' -name bpftool -type f -perm -u+x 2>/dev/null | sort -r) /usr/sbin/bpftool; do
            if sudo "$c" version >/dev/null 2>&1; then tool="$c"; break; fi
          done
          test -n "$tool" || { echo "no runnable bpftool; candidates:"; find /usr/lib /usr/sbin -name 'bpftool*' 2>/dev/null; exit 1; }
          sudo "$tool" version
          echo "BPFTOOL=$tool" >> "$GITHUB_ENV"
      - name: Record environment
        run: |
          set -x
          uname -a
          cat /etc/os-release | head -n 4
          ls -l /sys/kernel/btf/vmlinux
          sudo ls -d /sys/kernel/tracing/events/sched/sched_process_exec /sys/kernel/tracing/events/syscalls/sys_enter_openat
          cat /sys/kernel/security/lockdown || true
          cat /proc/sys/kernel/unprivileged_bpf_disabled || true
          grep CapEff /proc/self/status
          sudo grep CapEff /proc/self/status
          "$BPFTOOL" version
          sudo "$BPFTOOL" feature probe kernel | grep -iE "ringbuf|tracepoint" || true
      - name: Build probe
        working-directory: crates/kerneltrace-ebpf
        run: cargo build --release
      - name: Build live binary and capability report
        run: |
          cargo build --release --features live --locked -p kerneltrace-mcp
          ./target/release/kerneltrace-mcp --capabilities
          sudo ./target/release/kerneltrace-mcp --capabilities
      - name: Build live-kernel test (unprivileged)
        run: |
          bin=$(cargo test --features live --locked -p kerneltrace-mcp --test live_kernel --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "live_kernel" and .profile.test) | .executable')
          test -x "$bin" || { echo "test binary not found"; exit 1; }
          echo "LIVE_TEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run live-kernel test as root
        run: |
          sudo --preserve-env=BPFTOOL \
            KERNELTRACE_EBPF_OBJECT="${GITHUB_WORKSPACE}/crates/kerneltrace-ebpf/target/bpfel-unknown-none/release/kerneltrace-ebpf" \
            "$LIVE_TEST_BIN" --ignored --nocapture --test-threads=1
      - name: Leftover programs (diagnostic)
        if: always()
        run: sudo "${BPFTOOL:-bpftool}" prog show 2>/dev/null | grep -E "kt_(exec|exit|open)" || echo "no kt_* programs loaded"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
