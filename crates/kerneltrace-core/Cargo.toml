[package]
name = "kerneltrace-core"
description = "Event decoding, bounded buffering, filtering, sampling, retention and redaction for kerneltrace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Linux-only live source backed by an Aya ring buffer. Compiles to nothing on
# other platforms so `--all-features` stays usable everywhere.
live = ["dep:aya"]

[dependencies]
kerneltrace-common.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }

[dev-dependencies]
# Parses the compiled probe in tests/probe_object.rs (portable, no kernel needed).
aya-obj = "0.3.0"
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
