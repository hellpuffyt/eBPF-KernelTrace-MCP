[package]
name = "kerneltrace-ebpf"
description = "eBPF tracepoint programs for kerneltrace (build for bpfel-unknown-none with nightly + bpf-linker)"
version = "0.1.0"
edition = "2024"
license = "MIT OR GPL-2.0-only"
repository = "https://github.com/hellpuffyt/eBPF-KernelTrace-MCP"
publish = false

# Standalone workspace: this crate only builds for the BPF target.
[workspace]

[dependencies]
aya-ebpf = "0.2.1"
kerneltrace-common = { path = "../kerneltrace-common" }

[[bin]]
name = "kerneltrace-ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
panic = "abort"
overflow-checks = false
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
debug = 2
panic = "abort"
lto = true
codegen-units = 1
