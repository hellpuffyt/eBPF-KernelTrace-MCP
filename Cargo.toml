[workspace]
resolver = "3"
members = [
    "crates/kerneltrace-common",
    "crates/kerneltrace-core",
    "crates/kerneltrace-mcp",
]
# The eBPF probe targets `bpfel-unknown-none` and needs nightly + bpf-linker,
# so it is its own workspace. See crates/kerneltrace-ebpf/README.md.
exclude = ["crates/kerneltrace-ebpf"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hellpuffyt/eBPF-KernelTrace-MCP"

[workspace.dependencies]
kerneltrace-common = { path = "crates/kerneltrace-common", version = "0.2.0" }
kerneltrace-core = { path = "crates/kerneltrace-core", version = "0.2.0" }
anyhow = "1.0.100"
aya = "0.14.0"
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ctrlc = { version = "3.5", features = ["termination"] }
proptest = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_path_to_error = "0.1.20"
thiserror = "2.0"
toml = "1.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.bench]
debug = "line-tables-only"
